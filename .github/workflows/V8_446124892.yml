          }
          }
          } catch (e) {
          print("[!] stress threw: " + e);
          }
          print("[*] stress_proof=" + proof + "/" + pattern.length);
          if (proof >= 1) print("[+] STRESS_WRITE_PROOF");
          if (proof === pattern.length) print("[+] STRESS_WRITE_FULL");

