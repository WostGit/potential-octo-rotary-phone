      - name: Test 1 — extensive harness with print polyfill
        id: test1
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/out
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          banner() {
            echo ""
            echo "######################################################################"
            echo "# $(ts)  $*"
            echo "######################################################################"
          }
          log() { echo "[$(ts)] $*"; }
          dump_file() {
            local f="$1"
            if [ -f "$f" ]; then
              log "FILE $f ($(wc -c < "$f") bytes)"
              echo "----- BEGIN $f -----"
              cat "$f"
              echo "----- END $f -----"
            else
              log "FILE $f MISSING"
            fi
          }
          container_alive() {
            docker exec "$CONTAINER" true 2>/dev/null
          }
          ensure_container() {
            if container_alive; then
              log "container $CONTAINER is alive"
              return 0
            fi
            log "container $CONTAINER NOT alive — attempting restart"
            docker start "$CONTAINER" 2>&1 || true
            sleep 1
            if container_alive; then
              log "container restarted OK"
              return 0
            fi
            log "FATAL: container cannot be restarted"
            docker ps -a --filter "name=$CONTAINER" || true
            docker logs "$CONTAINER" 2>&1 | tail -50 || true
            return 1
          }
          run_d8() {
            local tag="$1"
            local jspath="$2"
            local out=/tmp/out/${tag}
            banner "RUN d8 tag=$tag js=$jspath"
            ensure_container || { echo "RESULT=CONTAINER_DEAD" | tee ${out}.result; echo "exit_code=999" | tee ${out}.rc; return 999; }

            log "Pre-flight: js file inside container"
            docker exec "$CONTAINER" sh -c "ls -la '$jspath'; wc -c '$jspath'; head -c 200 '$jspath'; echo" 2>&1 | tee ${out}.preflight.txt

            log "Pre-flight: d8 binary + snapshot"
            docker exec "$CONTAINER" sh -c 'ls -la /challenge/d8 /challenge/snapshot_blob.bin; cd /challenge && ./d8 --version' 2>&1 | tee -a ${out}.preflight.txt || true

            log "Executing: cd /challenge && timeout 60 ./d8 --experimental-wasm-custom-descriptors $jspath"
            local t0=$(date +%s)
            # Capture both streams; d8 often prints crash info on stderr
            docker exec "$CONTAINER" sh -c "
              cd /challenge || exit 97
              if command -v timeout >/dev/null 2>&1; then
                timeout 60 ./d8 --experimental-wasm-custom-descriptors '$jspath'
              else
                ./d8 --experimental-wasm-custom-descriptors '$jspath'
              fi
            " > ${out}.stdout 2> ${out}.stderr
            local rc=$?
            local t1=$(date +%s)
            log "d8 finished rc=$rc elapsed=$((t1-t0))s"

            echo "exit_code=$rc" | tee ${out}.rc
            dump_file ${out}.stdout
            dump_file ${out}.stderr

            # Engine-level crash signatures (NOT ordinary JS exceptions)
            if grep -qiE 'FATAL|Check failed|Debug check failed|SEGV|SIGSEGV|SIGABRT|Segmentation fault|Illegal instruction|DEADLYSIGNAL|Trace/breakpoint|AddressSanitizer|Aborted|Trace/BPT trap|Bus error|core dumped|Received signal' ${out}.stdout ${out}.stderr 2>/dev/null; then
              echo "RESULT=ENGINE_CRASH" | tee ${out}.result
            elif [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ] || [ "$rc" -eq 132 ] || [ "$rc" -eq 136 ]; then
              echo "RESULT=SIGNAL_EXIT_$rc" | tee ${out}.result
            elif [ "$rc" -ge 128 ]; then
              echo "RESULT=SIGNAL_EXIT_$rc" | tee ${out}.result
            elif grep -q 'UNEXPECTED: caged_write_unsafe returned' ${out}.stdout 2>/dev/null; then
              echo "RESULT=NO_CRASH_BUG_NOT_TRIGGERED" | tee ${out}.result
            elif grep -q 'instantiate FAILED' ${out}.stdout 2>/dev/null; then
              echo "RESULT=INSTANTIATE_FAILED" | tee ${out}.result
            elif grep -qiE 'SyntaxError|TypeError|ReferenceError|RangeError|CompileError|LinkError' ${out}.stdout ${out}.stderr 2>/dev/null; then
              # RuntimeError from wasm can appear before the SEGV path; still classify JS if no signal
              echo "RESULT=JS_ERROR" | tee ${out}.result
            elif [ "$rc" -eq 124 ]; then
              echo "RESULT=TIMEOUT" | tee ${out}.result
            elif [ "$rc" -eq 127 ]; then
              echo "RESULT=COMMAND_NOT_FOUND" | tee ${out}.result
            elif [ "$rc" -eq 97 ]; then
              echo "RESULT=NO_CHALLENGE_DIR" | tee ${out}.result
            else
              echo "RESULT=EXIT_$rc" | tee ${out}.result
            fi

            log "Post-flight container status"
            docker ps -a --filter "name=$CONTAINER" | tee ${out}.container.txt || true
            return $rc
          }
          # Use polyfilled harness: challenge patch removes print()
          run_d8 test1 /tmp/poc_test_poly.js
          exit 0

