            echo "Use stage_b/layout_section.txt to RE TypedArray backing-store offsets for abs R/W."
          } > "$DUMP_ROOT/README.md"
          cp -f /tmp/out/flag_seed.txt "$DUMP_ROOT/flag_seed.txt" 2>/dev/null || true
