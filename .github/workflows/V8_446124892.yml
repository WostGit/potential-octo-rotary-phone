            echo ""
            echo "| Test | Result | Exit |"
            echo "|------|--------|------|"
            for i in 1 2 3 4; do
              r=$(cat /tmp/out/test$i.result 2>/dev/null || echo n/a)
              c=$(cat /tmp/out/test$i.rc 2>/dev/null || echo n/a)
              echo "| $i | $r | $c |"
            done
            echo ""
            echo "### Notes"
            echo "- Challenge patch strips \`print\`/\`load\`/\`quit\` from d8 shell."
            echo "- Test 1/4 use \`poc_test_poly.js\` (print → console.log)."
            echo "- Test 2 uses original crash-only PoC (still SEGV without print)."
          } >> "$GITHUB_STEP_SUMMARY"

          log "artifact tree"
          find /tmp/out -type f -exec ls -la {} \; 2>/dev/null | sort

          docker rm -f "$CONTAINER" 2>/dev/null || true

          if [ "${{ github.event.inputs.fail_without_crash }}" = "true" ] && [ "$CRASH" -eq 0 ]; then
            log "Failing job because fail_without_crash=true and no crash observed"
            exit 1
          fi
          exit 0

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-446124892-poc-test-${{ github.run_id }}
          path: |
            /tmp/out/**
            /tmp/poc_test.js
            /tmp/poc_test_poly.js
            /tmp/poc_original.js
            /tmp/poc_tiny.js
          if-no-files-found: warn
          retention-days: 14
