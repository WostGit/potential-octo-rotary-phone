    - "name": |-
        Test 1 — extensive harness (inside container)
      "id": |-
        test1
      "run": |
        set +e
        echo "========== TEST 1: extensive harness (in-container d8) =========="
        docker exec "$CONTAINER" sh -c 'cd /challenge && timeout 60 ./d8 --experimental-wasm-custom-descriptors /tmp/poc_test.js' \
          > /tmp/out/test1.stdout 2> /tmp/out/test1.stderr
        RC=$?
        echo "exit_code=$RC" | tee /tmp/out/test1.rc
        echo "----- stdout -----"
        cat /tmp/out/test1.stdout
        echo "----- stderr -----"
        cat /tmp/out/test1.stderr
        if grep -qiE 'FATAL|Check failed|Debug check failed|SEGV|SIGSEGV|SIGABRT|Segmentation fault|Illegal instruction|DEADLYSIGNAL|Trace/breakpoint|AddressSanitizer|Aborted|Trace/BPT trap|Bus error' /tmp/out/test1.stdout /tmp/out/test1.stderr; then
          echo "RESULT=ENGINE_CRASH" | tee /tmp/out/test1.result
        elif [ "$RC" -ge 128 ]; then
          echo "RESULT=SIGNAL_EXIT_$RC" | tee /tmp/out/test1.result
        elif grep -q 'UNEXPECTED: caged_write_unsafe returned' /tmp/out/test1.stdout; then
          echo "RESULT=NO_CRASH_BUG_NOT_TRIGGERED" | tee /tmp/out/test1.result
        elif grep -q 'instantiate FAILED' /tmp/out/test1.stdout; then
          echo "RESULT=INSTANTIATE_FAILED" | tee /tmp/out/test1.result
        elif grep -qiE 'SyntaxError|TypeError|ReferenceError|RangeError' /tmp/out/test1.stdout /tmp/out/test1.stderr; then
          echo "RESULT=JS_ERROR" | tee /tmp/out/test1.result
        else
          echo "RESULT=EXIT_$RC" | tee /tmp/out/test1.result
        fi
    - "name": |-
        Test 2 — original crash-only (inside container)
      "run": |
        set +e
        echo "========== TEST 2: original caged_write_unsafe only =========="
        docker exec "$CONTAINER" sh -c 'cd /challenge && timeout 60 ./d8 --experimental-wasm-custom-descriptors /tmp/poc_original.js' \
          > /tmp/out/test2.stdout 2> /tmp/out/test2.stderr
        RC=$?
        echo "exit_code=$RC" | tee /tmp/out/test2.rc
        echo "----- stdout (last 100) -----"
        tail -100 /tmp/out/test2.stdout
        echo "----- stderr (last 100) -----"
        tail -100 /tmp/out/test2.stderr
        if grep -qiE 'FATAL|Check failed|Debug check failed|SEGV|SIGSEGV|SIGABRT|Segmentation fault|Illegal instruction|DEADLYSIGNAL|Trace/breakpoint|AddressSanitizer|Aborted|Trace/BPT trap|Bus error' /tmp/out/test2.stdout /tmp/out/test2.stderr; then
          echo "RESULT=ENGINE_CRASH" | tee /tmp/out/test2.result
        elif [ "$RC" -ge 128 ]; then
          echo "RESULT=SIGNAL_EXIT_$RC" | tee /tmp/out/test2.result
        elif grep -qiE 'SyntaxError|TypeError|ReferenceError|RangeError' /tmp/out/test2.stdout /tmp/out/test2.stderr; then
          echo "RESULT=JS_ERROR" | tee /tmp/out/test2.result
        else
          echo "RESULT=EXIT_$RC" | tee /tmp/out/test2.result
        fi
    - "name": |-
        Test 3 — environment + patch + catflag
      "run": |
        set +e
        echo "========== TEST 3: environment =========="
        docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors -e "print(\"d8_ok\"); print(typeof WebAssembly)"' \
          > /tmp/out/test3.stdout 2> /tmp/out/test3.stderr
        echo "d8_smoke_rc=$?"
        cat /tmp/out/test3.stdout
        docker exec "$CONTAINER" sh -c 'ls -la /challenge/catflag /challenge/patch /challenge/REVISION /challenge/args.gn 2>&1' | tee /tmp/out/challenge_ls.txt
        docker exec "$CONTAINER" sh -c '/challenge/catflag 2>&1 | head -5' | tee /tmp/out/catflag.out || true
        docker exec "$CONTAINER" sh -c 'head -50 /challenge/patch 2>/dev/null' | tee /tmp/out/patch_head.txt || true
        docker exec "$CONTAINER" sh -c 'cat /challenge/REVISION 2>/dev/null' | tee /tmp/out/revision.txt || true
        docker cp "$CONTAINER":/challenge/patch /tmp/out/patch 2>/dev/null || true
        docker cp "$CONTAINER":/challenge/REVISION /tmp/out/REVISION 2>/dev/null || true
        echo "RESULT=SMOKE_DONE" | tee /tmp/out/test3.result
    - "name": |-
        Test 4 — load() image wasm-module-builder + core
      "run": |
        set +e
        echo "========== TEST 4: load() image builder + core =========="
        docker exec "$CONTAINER" sh -c 'test -f /src/v8/test/mjsunit/wasm/wasm-module-builder.js && echo BUILDER_OK || echo BUILDER_MISSING' | tee /tmp/out/builder_status.txt
        if grep -q BUILDER_MISSING /tmp/out/builder_status.txt; then
          echo "RESULT=SKIP_NO_BUILDER" | tee /tmp/out/test4.result
          exit 0
        fi
        docker exec "$CONTAINER" sh -c 'python3 - << "PY"
        from pathlib import Path
        t = Path("/tmp/poc_original.js").read_text()
        idx = t.find("let builder = new WasmModuleBuilder()")
        if idx < 0:
            m = t.find("/// wasm-module-builder.js end")
            idx = t.find("let builder = new WasmModuleBuilder()", m if m >= 0 else 0)
        assert idx >= 0
        core = t[idx:]
        Path("/tmp/poc_load.js").write_text("load(\"/src/v8/test/mjsunit/wasm/wasm-module-builder.js\");\n\n" + core)
        print("wrote", Path("/tmp/poc_load.js").stat().st_size)
        PY'
        docker exec "$CONTAINER" sh -c 'cd /challenge && timeout 60 ./d8 --experimental-wasm-custom-descriptors /tmp/poc_load.js' \
          > /tmp/out/test4.stdout 2> /tmp/out/test4.stderr
        RC=$?
        echo "exit_code=$RC" | tee /tmp/out/test4.rc
        tail -80 /tmp/out/test4.stdout
        tail -80 /tmp/out/test4.stderr
        if grep -qiE 'FATAL|Check failed|Debug check failed|SEGV|SIGSEGV|SIGABRT|Segmentation fault|Illegal instruction|DEADLYSIGNAL|Trace/breakpoint|AddressSanitizer|Aborted' /tmp/out/test4.stdout /tmp/out/test4.stderr; then
          echo "RESULT=ENGINE_CRASH" | tee /tmp/out/test4.result
        elif [ "$RC" -ge 128 ]; then
          echo "RESULT=SIGNAL_EXIT_$RC" | tee /tmp/out/test4.result
        elif grep -qiE 'SyntaxError|TypeError|ReferenceError|RangeError' /tmp/out/test4.stdout /tmp/out/test4.stderr; then
          echo "RESULT=JS_ERROR" | tee /tmp/out/test4.result
        else
          echo "RESULT=EXIT_$RC" | tee /tmp/out/test4.result
        fi
    - "name": |-
        Summary
      "if": |-
        always()
      "run": |
        echo "==================== SUMMARY ===================="
        for i in 1 2 3 4; do
          echo -n "TEST$i: "
          cat /tmp/out/test$i.result 2>/dev/null || echo "(no result)"
          echo -n "  rc="
          cat /tmp/out/test$i.rc 2>/dev/null || echo "n/a"
        done
        echo "================================================="
        if grep -qE 'ENGINE_CRASH|SIGNAL_EXIT_' /tmp/out/test*.result 2>/dev/null; then
          echo "OVERALL: PoC triggered engine-level failure (good)"
        else
          echo "OVERALL: no engine crash detected — inspect artifacts"
          echo "----- test1 stdout -----"
          cat /tmp/out/test1.stdout 2>/dev/null || true
          echo "----- test1 stderr -----"
          cat /tmp/out/test1.stderr 2>/dev/null || true
        fi
        docker rm -f "$CONTAINER" 2>/dev/null || true
    - "name": |-
        Upload artifacts
      "if": |-
        always()
      "uses": |-
        actions/upload-artifact@v4
      "with":
        "name": |-
          v8-446124892-poc-test-${{ github.run_id }}
        "path": |
          /tmp/out/
          /tmp/poc_test.js
          /tmp/poc_original.js
        "if-no-files-found": |-
          warn
        "retention-days": 14
