          // ===================== EXTENDED PRIMITIVE HARNESS =====================
          print("[*] EXT: instantiate");
          let instance = builder.instantiate({import: {identity: x => x}});
          let {addrof, fakeobj, caged_read, caged_write, caged_write_unsafe} = instance.exports;
          print("[+] exports=" + Object.keys(instance.exports).join(","));

          print("[*] EXT Stage A: addrof stability");
          let stable = 0;
          for (let i = 0; i < 20; i++) {
          let o = {n: i, s: "x".repeat(i + 1)};
          let a = addrof(o), b = addrof(o);
          if ((a|0) === (b|0) && a) stable++;
          print("[+] obj" + i + " addrof=0x" + (a>>>0).toString(16));
          }
          print("[*] addrof_stable_count=" + stable + "/20");
          if (stable >= 18) print("[+] ADDROF_STABLE_OK");

          print("[*] EXT Stage B: fakeobj smoke");
          try {
          let o = {z: 1};
          let a = addrof(o);
