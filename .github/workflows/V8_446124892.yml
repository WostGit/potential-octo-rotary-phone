"name": |-
  V8-446124892 Official PoC Test
"on":
  "workflow_dispatch":
    "inputs":
      "timeout_minutes":
        "description": |-
          Job timeout in minutes
        "required": false
        "default": |-
          30
        "type": |-
          string
"jobs":
  "test-official-poc":
    "runs-on": |-
      ubuntu-latest
    "timeout-minutes": |-
      ${{ fromJSON(github.event.inputs.timeout_minutes || '30') }}
    "env":
      "IMAGE": |-
        cybergym/v8:human-446124892-nosandbox-buildable
      "CONTAINER": |-
        v8poc
    "steps":
    - "name": |-
        Free disk space
      "run": |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        df -h
    - "name": |-
        Pull vulnerable image
      "run": |
        docker pull "$IMAGE"
    - "name": |-
        Start challenge container
      "run": |
        set -euo pipefail
        docker rm -f "$CONTAINER" 2>/dev/null || true
        # Run d8 INSIDE the image — host-extracted binaries often fail on glibc/libs
        docker run -d --name "$CONTAINER" --entrypoint /bin/sleep "$IMAGE" infinity \
          || docker run -d --name "$CONTAINER" --entrypoint /bin/bash "$IMAGE" -c "sleep infinity"
        docker ps --filter "name=$CONTAINER"
        echo "===== container layout ====="
        docker exec "$CONTAINER" sh -c 'ls -la /challenge 2>/dev/null; ls -la /challenge/d8 /challenge/catflag /challenge/patch 2>/dev/null; ls -la /src/v8/test/mjsunit/wasm/wasm-module-builder.js 2>/dev/null' || true
        docker exec "$CONTAINER" sh -c '/challenge/d8 --version 2>&1 | head -5' || true
        docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors -e "print(1+1)" 2>&1' || true
    - "name": |-
        Write official PoC into container
