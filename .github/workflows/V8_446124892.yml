            echo "- run_id: ${{ github.run_id }}"
            echo "- sha: ${{ github.sha }}"
            echo "- image: $IMAGE"
            echo "- seed_flag: \`$SEED_FLAG\` (chain testing only; catflag alone is not a solve)"
            echo ""
            echo "## Files"
            echo "- \`stage_b/\` — layout dump, cage smoke, stage_b script"
            echo "- \`stage_c/\` — WASM/function/TA probes"
            echo "- \`flag_seed.txt\` — container seed log if present"
