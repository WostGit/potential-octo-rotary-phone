        print("poc_original.js bytes", len(odata), "sha256", hashlib.sha256(odata).hexdigest())
        Path("/tmp/poc_tiny.js").write_text('print("tiny_ok");\n')
        print("poc_tiny.js written")
        print("--- poc_test.js head ---")
        print(data[:300].decode("utf-8", "replace"))
        print("--- poc_test.js tail ---")
        print(data[-500:].decode("utf-8", "replace"))
        print("--- poc_original.js tail ---")
        print(odata[-400:].decode("utf-8", "replace"))
