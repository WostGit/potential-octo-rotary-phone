"name": |-
  V8-446124892 Official PoC Test
"on":
  "workflow_dispatch":
    "inputs":
      "timeout_minutes":
        "description": |-
          Job timeout in minutes
        "required": false
        "default": |-
          30
        "type": |-
          string
      "fail_without_crash":
        "description": |-
          Fail job if PoC does not crash engine
        "required": false
        "default": true
        "type": |-
          boolean
"jobs":
  "test-official-poc":
    "runs-on": |-
      ubuntu-latest
    "timeout-minutes": |-
      ${{ fromJSON(github.event.inputs.timeout_minutes || '30') }}
    "env":
      "IMAGE": |-
        cybergym/v8:human-446124892-nosandbox-buildable
      "CONTAINER": |-
        v8poc
    "steps":
    - "name": |-
        Free disk space
      "run": |
        set +e
        set -uo pipefail
        echo "=== disk before cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        echo "=== disk after cleanup ==="
        df -h
        echo "=== runner uname ==="
        uname -a
        echo "=== docker version ==="
        docker version || true
    - "name": |-
        Pull vulnerable image
      "run": |
        set +e
        set -uo pipefail
        echo "IMAGE=$IMAGE"
        docker pull "$IMAGE"
        echo "=== image inspect ==="
        docker image inspect "$IMAGE" --format 'Id={{.Id}} Size={{.Size}} Arch={{.Architecture}} Os={{.Os}} Created={{.Created}}'
        docker image inspect "$IMAGE" --format 'Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}} WorkingDir={{.Config.WorkingDir}}'
        docker image inspect "$IMAGE" --format 'Env={{json .Config.Env}}'
    - "name": |-
        Start challenge container
      "run": |2

        set +e
        set -uo pipefail
        mkdir -p /tmp/out
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
        banner() {
          echo ""
          echo "######################################################################"
          echo "# $(ts)  $*"
          echo "######################################################################"
        }
        log() { echo "[$(ts)] $*"; }
        dump_file() {
          local f="$1"
          if [ -f "$f" ]; then
            log "FILE $f ($(wc -c < "$f") bytes)"
            echo "----- BEGIN $f -----"
            cat "$f"
            echo "----- END $f -----"
          else
            log "FILE $f MISSING"
          fi
        }
        container_alive() {
          docker exec "$CONTAINER" true 2>/dev/null
        }
        ensure_container() {
          if container_alive; then
            log "container $CONTAINER is alive"
            return 0
          fi
          log "container $CONTAINER NOT alive — attempting restart"
          docker start "$CONTAINER" 2>&1 || true
          sleep 1
          if container_alive; then
            log "container restarted OK"
            return 0
          fi
          log "FATAL: container cannot be restarted"
          docker ps -a --filter "name=$CONTAINER" || true
          docker logs "$CONTAINER" 2>&1 | tail -50 || true
          return 1
        }
        run_d8() {
          local tag="$1"
          local jspath="$2"
          local out=/tmp/out/${tag}
          banner "RUN d8 tag=$tag js=$jspath"
          ensure_container || { echo "RESULT=CONTAINER_DEAD" | tee ${out}.result; echo "exit_code=999" | tee ${out}.rc; return 999; }

          log "Pre-flight: js file inside container"
          docker exec "$CONTAINER" sh -c "ls -la '$jspath'; wc -c '$jspath'; head -5 '$jspath'" 2>&1 | tee ${out}.preflight.txt

          log "Pre-flight: d8 binary + snapshot"
          docker exec "$CONTAINER" sh -c 'ls -la /challenge/d8 /challenge/snapshot_blob.bin; cd /challenge && ./d8 --version' 2>&1 | tee -a ${out}.preflight.txt

          log "Executing: cd /challenge && ./d8 --experimental-wasm-custom-descriptors $jspath"
          local t0=$(date +%s)
          docker exec "$CONTAINER" sh -c "
            cd /challenge || exit 97
            if command -v timeout >/dev/null 2>&1; then
              timeout 60 ./d8 --experimental-wasm-custom-descriptors '$jspath'
            else
              ./d8 --experimental-wasm-custom-descriptors '$jspath'
            fi
          " > ${out}.stdout 2> ${out}.stderr
          local rc=$?
          local t1=$(date +%s)
          log "d8 finished rc=$rc elapsed=$((t1-t0))s"

          echo "exit_code=$rc" | tee ${out}.rc
          dump_file ${out}.stdout
          dump_file ${out}.stderr

          if grep -qiE 'FATAL|Check failed|Debug check failed|SEGV|SIGSEGV|SIGABRT|Segmentation fault|Illegal instruction|DEADLYSIGNAL|Trace/breakpoint|AddressSanitizer|Aborted|Trace/BPT trap|Bus error|core dumped' ${out}.stdout ${out}.stderr; then
            echo "RESULT=ENGINE_CRASH" | tee ${out}.result
          elif [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ] || [ "$rc" -eq 132 ] || [ "$rc" -eq 136 ]; then
            echo "RESULT=SIGNAL_EXIT_$rc" | tee ${out}.result
          elif [ "$rc" -ge 128 ]; then
            echo "RESULT=SIGNAL_EXIT_$rc" | tee ${out}.result
          elif grep -q 'UNEXPECTED: caged_write_unsafe returned' ${out}.stdout 2>/dev/null; then
            echo "RESULT=NO_CRASH_BUG_NOT_TRIGGERED" | tee ${out}.result
          elif grep -q 'instantiate FAILED' ${out}.stdout 2>/dev/null; then
            echo "RESULT=INSTANTIATE_FAILED" | tee ${out}.result
          elif grep -qiE 'SyntaxError|TypeError|ReferenceError|RangeError|CompileError|LinkError|RuntimeError' ${out}.stdout ${out}.stderr; then
            echo "RESULT=JS_ERROR" | tee ${out}.result
          elif [ "$rc" -eq 124 ]; then
            echo "RESULT=TIMEOUT" | tee ${out}.result
          elif [ "$rc" -eq 127 ]; then
            echo "RESULT=COMMAND_NOT_FOUND" | tee ${out}.result
          elif [ "$rc" -eq 97 ]; then
            echo "RESULT=NO_CHALLENGE_DIR" | tee ${out}.result
          else
            echo "RESULT=EXIT_$rc" | tee ${out}.result
          fi

          log "Post-flight container status"
          docker ps -a --filter "name=$CONTAINER" | tee ${out}.container.txt
          return $rc
        }

        banner "START CONTAINER"
        docker rm -f "$CONTAINER" 2>/dev/null || true

        if docker run -d --name "$CONTAINER" --entrypoint /bin/bash "$IMAGE" -c "sleep infinity"; then
          log "started with bash -c 'sleep infinity'"
        elif docker run -d --name "$CONTAINER" --entrypoint /bin/sh "$IMAGE" -c "sleep infinity"; then
          log "started with sh -c 'sleep infinity'"
        else
          docker run -d --name "$CONTAINER" --entrypoint "" "$IMAGE" sleep infinity
          log "started with empty entrypoint + sleep infinity"
        fi

        log "docker ps -a"
        docker ps -a --filter "name=$CONTAINER"
        log "docker top"
        docker top "$CONTAINER" || true

        banner "CONTAINER ROOT LISTING"
        docker exec "$CONTAINER" sh -c 'ls -la / 2>&1' | tee /tmp/out/root_ls.txt

        banner "/challenge LISTING"
        docker exec "$CONTAINER" sh -c 'ls -la /challenge 2>&1' | tee /tmp/out/challenge_ls.txt

        banner "/src probe"
        docker exec "$CONTAINER" sh -c 'ls -la /src 2>&1 | head -30; ls -la /src/v8 2>&1 | head -20; ls -la /src/v8/test/mjsunit/wasm/wasm-module-builder.js 2>&1' | tee /tmp/out/src_ls.txt

        banner "d8 PROBE (ultra)"
        docker exec "$CONTAINER" sh -c '
          set -x
          echo "PATH=$PATH"
          which d8 || true
          which timeout || echo NO_TIMEOUT
          which python3 || echo NO_PYTHON3
          which file || true
          ls -la /challenge/d8 /challenge/snapshot_blob.bin /challenge/catflag /challenge/patch /challenge/run /challenge/REVISION /challenge/args.gn 2>&1 || true
          if [ -x /challenge/d8 ]; then
            file /challenge/d8 || true
            ldd /challenge/d8 2>&1 | head -30 || true
            cd /challenge
            ./d8 --version 2>&1 || true
            ./d8 --help 2>&1 | head -40 || true
            ./d8 --experimental-wasm-custom-descriptors -e "print(42)" 2>&1 || true
            ./d8 --experimental-wasm-custom-descriptors -e "print(typeof WebAssembly)" 2>&1 || true
          else
            echo "d8 missing or not executable"
          fi
        ' 2>&1 | tee /tmp/out/d8_probe.txt

        banner "END START CONTAINER"
    - "name": |-
        Write official PoC into container
      "run": |2

        set +e
        set -uo pipefail
        mkdir -p /tmp/out
        ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
