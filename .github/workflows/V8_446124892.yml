            echo "RESULT=NO_CHALLENGE_DIR" | tee ${out}.result
          else
            echo "RESULT=EXIT_$rc" | tee ${out}.result
          fi

          log "Post-flight container status"
          docker ps -a --filter "name=$CONTAINER" | tee ${out}.container.txt
          return $rc
        }

        banner "WRITE OFFICIAL PoC"

        python3 - << 'PY'
        import base64, hashlib
        from pathlib import Path
