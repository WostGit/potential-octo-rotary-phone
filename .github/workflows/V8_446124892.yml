      - name: Ensure paths and PoC files (host + container)
        if: always()
        run: |
          set +e
          set -uo pipefail
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          log() { echo "[$(ts)] $*"; }
          banner() { echo ""; echo "######################################################################"; echo "# $(ts)  $*"; echo "######################################################################"; }
          banner "ENSURE PATHS AND FILES"

          # --- host ---
          mkdir -p /tmp/out /tmp/workspace_host
          touch /tmp/out/.keep

          # Rebuild poly if missing but base exists
          if [ ! -s /tmp/poc_test_poly.js ] && [ -s /tmp/poc_test.js ]; then
            log "rebuilding poc_test_poly.js"
            {
              echo '// Polyfill: challenge d8 strips print/load/quit'
              echo 'globalThis.print = function(...args) { console.log(...args); };'
              cat /tmp/poc_test.js
            } > /tmp/poc_test_poly.js
          fi
          if [ ! -s /tmp/poc_tiny.js ]; then
            echo 'console.log("tiny_ok");' > /tmp/poc_tiny.js
          fi

          log "host files:"
          ls -la /tmp/poc_test.js /tmp/poc_test_poly.js /tmp/poc_original.js /tmp/poc_tiny.js /tmp/out 2>&1 || true

          # --- container ---
          if ! docker exec "$CONTAINER" true 2>/dev/null; then
            log "container not running — start"
            docker start "$CONTAINER" 2>&1 || true
            sleep 2
          fi
          if ! docker exec "$CONTAINER" true 2>/dev/null; then
            log "WARNING: container still unreachable"
            echo "ENSURE_CONTAINER=0" | tee /tmp/out/ensure.result
            exit 0
          fi

          docker exec "$CONTAINER" sh -c 'mkdir -p /tmp /workspace; chmod 1777 /tmp 2>/dev/null; chmod 755 /workspace 2>/dev/null; ls -lad /tmp /workspace'

          # Re-copy any missing/empty PoCs into container
          for f in poc_test.js poc_test_poly.js poc_original.js poc_tiny.js; do
            if [ ! -s "/tmp/$f" ]; then
              log "skip $f (missing on host)"
              continue
            fi
            if ! docker exec "$CONTAINER" sh -c "test -s /tmp/$f"; then
              log "restoring /tmp/$f into container"
              docker cp "/tmp/$f" "$CONTAINER":"/tmp/$f" 2>/dev/null || \
                base64 -w0 "/tmp/$f" | docker exec -i "$CONTAINER" sh -c "base64 -d > /tmp/$f"
            fi
            if docker exec "$CONTAINER" sh -c "test -s /tmp/$f"; then
              log "OK container /tmp/$f ($(docker exec "$CONTAINER" wc -c < /tmp/$f) bytes)"
            else
              log "FAIL container /tmp/$f still missing"
            fi
          done

          docker exec "$CONTAINER" sh -c 'ls -la /tmp/poc*.js 2>/dev/null; ls -la /workspace; echo ENSURE_DONE'
          echo "ENSURE_CONTAINER=1" | tee /tmp/out/ensure.result
          log "ensure step complete"

      - name: Anti-cheat — integrity of image, d8, PoC
        id: anticheat
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/out
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          banner() { echo ""; echo "######################################################################"; echo "# $(ts)  $*"; echo "######################################################################"; }
          log() { echo "[$(ts)] $*"; }
          dump_file() {
            local f="$1"
            if [ -f "$f" ]; then
              log "FILE $f ($(wc -c < "$f") bytes)"
              echo "----- BEGIN $f -----"
              cat "$f"
              echo "----- END $f -----"
            else
              log "FILE $f MISSING"
            fi
          }
          FAIL=0
          banner "ANTI-CHEAT INTEGRITY"

          log "=== container status ==="
          docker ps -a --filter "name=$CONTAINER" --no-trunc
          docker inspect "$CONTAINER" --format 'Id={{.Id}} State={{.State.Status}} OOM={{.State.OOMKilled}} Exit={{.State.ExitCode}}' 2>&1 | tee /tmp/out/anticheat_container.txt

          log "=== image id ==="
          docker image inspect "$IMAGE" --format 'Id={{.Id}} Size={{.Size}} Digests={{json .RepoDigests}}' 2>&1 | tee /tmp/out/anticheat_image.txt

          log "=== REVISION (must be exact challenge build) ==="
          docker exec "$CONTAINER" sh -c 'echo REVISION=$(cat /challenge/REVISION); echo; echo === args.gn ===; cat /challenge/args.gn; echo; echo === d8 version ===; cd /challenge && ./d8 --version; echo; echo === file sizes ===; ls -la /challenge/d8 /challenge/snapshot_blob.bin /challenge/patch /challenge/run; echo; echo === d8 sha256 ===; sha256sum /challenge/d8 /challenge/snapshot_blob.bin' 2>&1 | tee /tmp/out/anticheat_revision.txt
          dump_file /tmp/out/anticheat_revision.txt

          log "=== PoC sha256 on host (must match official) ==="
          sha256sum /tmp/poc_test.js /tmp/poc_original.js /tmp/poc_test_poly.js /tmp/poc_tiny.js 2>&1 | tee /tmp/out/anticheat_poc_sha.txt
          dump_file /tmp/out/anticheat_poc_sha.txt

          EXPECT_TEST="8273ec8866153fe7480a63ea3c67203f18effe6dd6fbac355c4e3db55b09dbfd"
          EXPECT_ORIG="ff32758944287f3aabab19d595e5247ba8eb5a7fe34d6313ee6c12c7a8cd8608"
          GOT_TEST=$(sha256sum /tmp/poc_test.js | awk '{print $1}')
          GOT_ORIG=$(sha256sum /tmp/poc_original.js | awk '{print $1}')
          log "expect poc_test=$EXPECT_TEST"
          log "got    poc_test=$GOT_TEST"
          log "expect poc_orig=$EXPECT_ORIG"
          log "got    poc_orig=$GOT_ORIG"
          if [ "$GOT_TEST" != "$EXPECT_TEST" ]; then log "FAIL poc_test sha256 mismatch"; FAIL=1; fi
          if [ "$GOT_ORIG" != "$EXPECT_ORIG" ]; then log "FAIL poc_original sha256 mismatch"; FAIL=1; fi

          log "=== PoC inside container must match host ==="
          docker exec "$CONTAINER" sh -c 'sha256sum /tmp/poc_test.js /tmp/poc_original.js /tmp/poc_test_poly.js /tmp/poc_tiny.js' 2>&1 | tee /tmp/out/anticheat_poc_in_container.txt
          HOST_TEST=$GOT_TEST
          CTR_TEST=$(docker exec "$CONTAINER" sha256sum /tmp/poc_test.js | awk '{print $1}')
          if [ "$HOST_TEST" != "$CTR_TEST" ]; then log "FAIL host/container poc_test mismatch"; FAIL=1; else log "host/container poc_test match OK"; fi

          log "=== patch must strip print/load/quit ==="
          docker exec "$CONTAINER" sh -c 'echo "=== patch head ==="; head -80 /challenge/patch; echo "=== patch grep print/load/quit ==="; grep -nE "print|load|quit" /challenge/patch | head -40' 2>&1 | tee /tmp/out/anticheat_patch.txt
          dump_file /tmp/out/anticheat_patch.txt
          if ! grep -qiE 'print|load|quit' /tmp/out/anticheat_patch.txt; then
            log "WARNING: patch text did not mention print/load/quit (still continuing)"
          else
            log "patch references shell builtins OK"
          fi

          log "=== prove print is stripped (must ReferenceError without polyfill) ==="
          docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors -e "print(1)"' > /tmp/out/print_stripped.stdout 2> /tmp/out/print_stripped.stderr
          echo "rc=$?" | tee /tmp/out/print_stripped.rc
          cat /tmp/out/print_stripped.stdout /tmp/out/print_stripped.stderr | tee /tmp/out/print_stripped.txt
          if grep -qiE 'ReferenceError|print is not defined|not defined' /tmp/out/print_stripped.txt; then
            log "PROOF: print is stripped (ReferenceError) OK"
          else
            log "FAIL: expected ReferenceError for print() - possible non-challenge d8"
            FAIL=1
          fi

          log "=== prove console.log works (control) ==="
          docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors -e "console.log(\"console_ok_42\")"' > /tmp/out/console_ok.stdout 2> /tmp/out/console_ok.stderr
          cat /tmp/out/console_ok.stdout /tmp/out/console_ok.stderr | tee /tmp/out/console_ok.txt
          if grep -q console_ok_42 /tmp/out/console_ok.txt; then log "console.log control OK"; else log "FAIL console.log control"; FAIL=1; fi

          log "=== benign script must NOT crash (anti false-positive) ==="
          docker exec "$CONTAINER" sh -c 'cd /challenge && ./d8 --experimental-wasm-custom-descriptors -e "console.log(1+1); console.log(\"benign_ok\")"' > /tmp/out/benign.stdout 2> /tmp/out/benign.stderr
          echo "rc=$?" | tee /tmp/out/benign.rc
          cat /tmp/out/benign.stdout /tmp/out/benign.stderr | tee /tmp/out/benign.txt
          BRC=$(cat /tmp/out/benign.rc | sed 's/rc=//')
          if [ "$BRC" = "0" ] && grep -q benign_ok /tmp/out/benign.txt; then
            log "benign non-crash OK (rc=0)"
          else
            log "FAIL: benign script did not exit cleanly - environment broken"
            FAIL=1
          fi

          log "=== empty/harmless script must NOT produce ENGINE_CRASH markers ==="
          if grep -qiE 'Received signal|SEGV_ACCERR|Check failed|FATAL' /tmp/out/benign.txt; then
            log "FAIL: benign run showed crash markers"
            FAIL=1
          else
            log "benign has no crash markers OK"
          fi

          echo "ANTICHEAT_FAIL=$FAIL" | tee /tmp/out/anticheat.result
          if [ "$FAIL" -ne 0 ]; then
            log "ANTI-CHEAT FAILED"
            exit 1
          fi
          log "ANTI-CHEAT PASSED"
          exit 0

      - name: Test 1 — extensive harness with print polyfill (verbose)
        id: test1
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/out
          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }
          banner() { echo ""; echo "######################################################################"; echo "# $(ts)  $*"; echo "######################################################################"; }
          log() { echo "[$(ts)] $*"; }
          dump_file() {
            local f="$1"
            if [ -f "$f" ]; then
              log "FILE $f ($(wc -c < "$f") bytes)"
              echo "----- BEGIN $f -----"
              cat "$f"
              echo "----- END $f -----"
            else
              log "FILE $f MISSING"
            fi
          }
          run_d8() {
            local tag="$1"
            local jspath="$2"
            local out="/tmp/out/${tag}"
            banner "RUN d8 tag=$tag js=$jspath"
            log "js sha256=$(docker exec "$CONTAINER" sha256sum "$jspath" | awk '{print $1}')"
            log "js size=$(docker exec "$CONTAINER" wc -c < "$jspath")"
            log "cmdline: cd /challenge && ./d8 --experimental-wasm-custom-descriptors $jspath"
            log "d8 sha256=$(docker exec "$CONTAINER" sha256sum /challenge/d8 | awk '{print $1}')"
            docker exec "$CONTAINER" sh -c "cd /challenge && ./d8 --experimental-wasm-custom-descriptors $jspath" > "${out}.stdout" 2> "${out}.stderr"
            local rc=$?
            echo "$rc" > "${out}.rc"
            log "rc=$rc"
            cat "${out}.stdout" "${out}.stderr" > "${out}.combined"
            log "stdout bytes=$(wc -c < "${out}.stdout") stderr bytes=$(wc -c < "${out}.stderr")"
            echo "----- COMBINED (first 200 lines) -----"
            head -200 "${out}.combined" || true
            echo "----- COMBINED (last 80 lines) -----"
            tail -80 "${out}.combined" || true
            if grep -qiE 'Received signal|SEGV_ACCERR|SEGV_|SIGSEGV|Check failed|FATAL|AddressSanitizer|SEGV' "${out}.combined"; then
              echo "RESULT=ENGINE_CRASH" | tee "${out}.result"
            elif grep -qiE 'SIGNAL_EXIT|signal 11|signal 6|signal 4' "${out}.combined"; then
              echo "RESULT=ENGINE_CRASH" | tee "${out}.result"
            elif [ "$rc" -eq 139 ] || [ "$rc" -eq 134 ] || [ "$rc" -eq 132 ]; then
              echo "RESULT=SIGNAL_EXIT_${rc}" | tee "${out}.result"
            elif [ "$rc" -eq 0 ]; then
              echo "RESULT=CLEAN_EXIT" | tee "${out}.result"
            else
              echo "RESULT=NONZERO_${rc}" | tee "${out}.result"
            fi
            grep -oE 'Received signal [0-9]+ [A-Z_]+ [0-9a-fA-Fx]+' "${out}.combined" | head -5 | tee "${out}.fault" || true
            grep -oE 'SEGV_ACCERR [0-9a-fA-F]+' "${out}.combined" | head -5 | tee -a "${out}.fault" || true
            log "result=$(cat "${out}.result")"
            dump_file "${out}.fault"
          }

          banner "TEST 1 - polyfilled extensive harness"
          run_d8 test1 /tmp/poc_test_poly.js

          log "=== stage evidence ==="
          for s in "instantiate OK" "Exports ready" "Stage 1" "addrof" "Stage 2" "Stage 3" "Stage 4" "caged_write_unsafe"; do
            if grep -q "$s" /tmp/out/test1.combined; then log "FOUND stage marker: $s"; else log "MISSING stage marker: $s"; fi
          done
          if grep -qoE 'addrof = [0-9]+' /tmp/out/test1.combined; then
            log "PROOF addrof numeric: $(grep -oE 'addrof = [0-9]+ \(0x[0-9a-f]+\)' /tmp/out/test1.combined | head -1)"
          else
            log "WARNING: no numeric addrof line (may still crash later)"
          fi
          exit 0

